es\": false,\n      \"type\": \"object\",\n      \"title\": \"AWS RDS Instance\"\n    },\n    \"aws_role\": {\n      \"properties\": {\n        \"arn\": {\n          \"type\": \"string\"\n        },\n        \"name\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"arn\", \"name\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"AWS Role\"\n    },\n    \"gcp_bucket\": {\n      \"properties\": {\n        \"bucket_id\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"bucket_id\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"GCP Bucket\"\n    },\n    \"gcp_compute_instance\": {\n      \"properties\": {\n        \"instance_id\": {\n          \"type\": \"string\"\n        },\n        \"project_id\": {\n          \"type\": \"string\"\n        },\n        \"zone\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"instance_id\", \"project_id\", \"zone\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"GCP Compute Instance\"\n    },\n    \"gcp_folder\": {\n      \"properties\": {\n        \"folder_id\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"folder_id\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"GCP Folder\"\n    },\n    \"gcp_gke_cluster\": {\n      \"properties\": {\n        \"cluster_name\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"cluster_name\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"GCP GKE Cluster\"\n    },\n    \"gcp_project\": {\n      \"properties\": {\n        \"project_id\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"project_id\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"GCP Project\"\n    },\n    \"gcp_sql_instance\": {\n      \"properties\": {\n        \"instance_id\": {\n          \"type\": \"string\"\n        },\n        \"project_id\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"instance_id\", \"project_id\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"GCP SQL Instance\"\n    },\n    \"git_hub_repo\": {\n      \"properties\": {\n        \"org_name\": {\n          \"type\": \"string\"\n        },\n        \"repo_name\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"org_name\", \"repo_name\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"GitHub Repo\"\n    },\n    \"okta_directory_app\": {\n      \"properties\": {\n        \"app_id\": {\n          \"type\": \"string\"\n        },\n        \"logo_url\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"app_id\", \"logo_url\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"Okta Directory App\"\n    },\n    \"okta_directory_role\": {\n      \"properties\": {\n        \"role_type\": {\n          \"type\": \"string\"\n        },\n        \"role_id\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"role_type\", \"role_id\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"Okta Directory Role\"\n    },\n    \"salesforce_profile\": {\n      \"properties\": {\n        \"user_license\": {\n          \"type\": \"string\"\n        }\n      },\n      \"required\": [\"user_license\"],\n      \"additionalProperties\": false,\n      \"type\": \"object\",\n      \"title\": \"Salesforce Profile\"\n    }\n  },\n  \"additionalProperties\": false,\n  \"minProperties\": 1,\n  \"maxProperties\": 1,\n  \"type\": \"object\"\n}\n```"
