aid: opal-security
name: Opal Security
description: >-
  Opal Security (legal entity Perma Security, Inc.) is a next-generation access
  management and identity security platform that gives enterprises comprehensive
  visibility into access across their systems, orchestrates just-in-time and
  least-privilege access, designs intelligent access policies, and automates user
  access reviews (UARs). Opal exposes a RESTful API at https://api.opal.dev/v1
  covering apps, resources, groups, users, bundles, access requests, access rules,
  owners, events, event streaming, sessions, and tokens, plus official SDKs
  (Python, Go), a CLI, a Terraform provider, and three hosted Model Context
  Protocol (MCP) servers for AI agents. Backed by Greylock. Sector: cybersecurity.
url: https://raw.githubusercontent.com/api-evangelist/opal-security/refs/heads/main/apis.yml
