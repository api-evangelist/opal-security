security_measures:
- Personnel security awareness training and confidentiality agreements.
- Two-factor authentication gating production data access; time-bound, on-call event-bound elevated access; periodic access reviews.
- Encryption in transit (TLS 1.2+ / VPN) and at rest (AWS KMS), including database backups.
- Automated alerting and searchable audit logging of access-change events; internal Opal employee actions logged.
- Daily encrypted database backups (AWS KMS) for the cloud offering.
- Secure SDLC — third-party automated security testing pre-release, peer-reviewed production releases.
- Intrusion prevention/detection monitoring; documented incident response plan.
- Vulnerability management program with monthly internal scans and >= annual third-party penetration testing.
