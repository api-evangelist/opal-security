        max_duration:
          description: The maximum duration for which the group can be requested (in minutes).
          type: integer
          example: 120
        recommended_duration:
          description: The recommended duration for which the group should be requested (in minutes). -1 represents an indefinite duration.
          type: integer
          example: 120
        extensions_duration_in_minutes:
          description: The duration for which access can be extended (in minutes). Set to 0 to disable extensions. When > 0, extensions are enabled for the specified duration.
          type: integer
          example: 120
